<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FP // PARSER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --surface: #0c0c0c;
      --border: #1f1f1f;
      --border-hover: #444;
      --text: #f2f2f2;
      --muted: #777;
      --accent: #ffffff;
      --accent-inv: #050505;
    }
    body.light {
      --bg: #fafafa;
      --surface: #ffffff;
      --border: #e5e5e5;
      --border-hover: #999;
      --text: #111111;
      --muted: #666666;
      --accent: #000000;
      --accent-inv: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      letter-spacing: -0.01em;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }
    .mono { font-family: 'JetBrains Mono', monospace; font-weight: 300; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { font-size: 15px; letter-spacing: 0.18em; font-weight: 400; display: flex; align-items: center; gap: 10px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text); display: inline-block; }
    .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    button, input, select {
      font-family: inherit; font-weight: 300; font-size: 13px;
      background: transparent; color: var(--text);
      border: 1px solid var(--border); padding: 8px 14px;
      outline: none; transition: 0.15s;
    }
    button { cursor: pointer; }
    button:hover { border-color: var(--border-hover); }
    button.primary { background: var(--accent); color: var(--accent-inv); border-color: var(--accent); }
    button.primary:hover { opacity: 0.85; }
    input:focus, select:focus { border-color: var(--text); }
    select option { background: var(--bg); color: var(--text); }

    /* Filters */
    .toolbar {
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    }
    .tabs { display: flex; gap: 6px; }
    .tab.active { background: var(--accent); color: var(--accent-inv); border-color: var(--accent); }
    .search-input { flex: 1; min-width: 220px; }
    .stats { margin-left: auto; font-size: 12px; color: var(--muted); }

    /* Grid */
    main { padding: 24px 28px 80px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 18px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
    .card-top { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); }
    .badge { border: 1px solid var(--border); padding: 2px 7px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
    .online-tag { color: var(--text); }
    .card-title { font-size: 14px; line-height: 1.45; font-weight: 300; word-break: break-word; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 2px 6px; }
    .card-foot {
      border-top: 1px solid var(--border); padding-top: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .price { font-size: 16px; font-weight: 400; }
    .seller { font-size: 12px; color: var(--muted); }
    .card-btns { display: flex; gap: 6px; }
    .card-btns a, .card-btns button {
      font-size: 12px; padding: 6px 10px; text-decoration: none;
      color: var(--text); border: 1px solid var(--border);
    }
    .card-btns a:hover { border-color: var(--text); }

    /* Modal & Drawer */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; z-index: 40;
    }
    .overlay.open { display: block; }
    .modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 92%; max-width: 440px; background: var(--bg);
      border: 1px solid var(--border); padding: 24px; z-index: 50; display: none;
    }
    .modal.open { display: block; }
    .modal h3 { font-weight: 300; font-size: 16px; margin-bottom: 10px; letter-spacing: 0.05em; }
    .modal p { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
    .modal input { width: 100%; margin-bottom: 12px; }

    /* Chat Drawer */
    .drawer {
      position: fixed; top: 0; right: -460px; width: 100%; max-width: 440px; height: 100vh;
      background: var(--bg); border-left: 1px solid var(--border);
      z-index: 50; display: flex; flex-direction: column; transition: right 0.25s ease;
    }
    .drawer.open { right: 0; }
    .drawer-head {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
    .chat-list-item {
      border: 1px solid var(--border); padding: 12px; cursor: pointer; transition: 0.15s;
    }
    .chat-list-item:hover { border-color: var(--text); }
    .msg { max-width: 85%; padding: 10px 12px; border: 1px solid var(--border); font-size: 13px; line-height: 1.4; white-space: pre-wrap; }
    .msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-inv); border-color: var(--accent); }
    .msg-meta { font-size: 10px; opacity: 0.6; margin-top: 4px; }
    .drawer-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .drawer-foot input { flex: 1; }

    .loader { text-align: center; padding: 60px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> FP // PARSER</div>
    <div class="actions">
      <button onclick="loadLots(true)">↻ Обновить лоты</button>
      <button onclick="openChatsDrawer()">Чаты</button>
      <button id="authBtn" class="primary" onclick="openAuthModal()">Войти в FunPay</button>
      <button onclick="document.body.classList.toggle('light')" title="Тема">◐</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-game="all" onclick="setGame('all', this)">Все</button>
      <button class="tab" data-game="dota2" onclick="setGame('dota2', this)">Dota 2</button>
      <button class="tab" data-game="valorant" onclick="setGame('valorant', this)">Valorant</button>
    </div>
    <input class="search-input" id="searchInput" placeholder="Поиск по описанию, MMR, скинам, почте..." oninput="renderLots()" />
    <input id="maxPrice" type="number" placeholder="Макс. цена ₽" style="width:130px" oninput="renderLots()" />
    <select id="sortSelect" onchange="renderLots()">
      <option value="default">По умолчанию</option>
      <option value="asc">Сначала дешевле</option>
      <option value="desc">Сначала дороже</option>
    </select>
    <label style="font-size:12px; display:flex; align-items:center; gap:6px; cursor:pointer;">
      <input type="checkbox" id="onlineOnly" onchange="renderLots()" /> Только онлайн
    </label>
    <div class="stats mono" id="statsText">Загрузка...</div>
  </div>

  <main>
    <div id="lotsContainer" class="grid"></div>
  </main>

  <!-- Overlay -->
  <div class="overlay" id="overlay" onclick="closeAll()"></div>

  <!-- Auth Modal -->
  <div class="modal" id="authModal">
    <h3>АВТОРИЗАЦИЯ FUNPAY</h3>
    <p>Введи свой <span class="mono">golden_key</span> из cookies сайта FunPay. Ключ хранится только в твоем браузере и нужен для синхронизации твоих чатов.</p>
    <input id="goldenKeyInput" type="password" placeholder="Вставь golden_key..." />
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button onclick="logout()" id="logoutBtn" style="display:none;">Выйти</button>
      <button onclick="closeAll()">Отмена</button>
      <button class="primary" onclick="saveAuth()">Подключить</button>
    </div>
    <div id="authError" style="color:#ff5555; font-size:12px; margin-top:10px;"></div>
  </div>

  <!-- Chat Drawer -->
  <div class="drawer" id="chatDrawer">
    <div class="drawer-head">
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="backToChatsBtn" style="display:none; padding:4px 8px;" onclick="showChatList()">←</button>
        <span id="drawerTitle" class="mono" style="font-size:13px;">ЧАТЫ FUNPAY</span>
      </div>
      <button onclick="closeAll()" style="padding:4px 10px;">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot" style="display:none;">
      <input id="msgInput" placeholder="Написать продавцу..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button class="primary" onclick="sendMessage()">→</button>
    </div>
  </div>

  <script>
    let allLots = [];
    let currentGame = "all";
    let fpKey = localStorage.getItem("fp_golden_key") || "";
    let currentUser = null;
    let activeNodeId = null;
    let pollTimer = null;

    async function loadLots(force = false) {
      document.getElementById("lotsContainer").innerHTML = `<div class="loader mono">Парсим актуальные лоты с FunPay...</div>`;
      try {
        const res = await fetch(`/api/lots?force=${force}`);
        const data = await res.json();
        allLots = data.lots || [];
        renderLots();
      } catch (e) {
        document.getElementById("lotsContainer").innerHTML = `<div class="loader">Ошибка связи с сервером.</div>`;
      }
    }

    function setGame(game, btn) {
      currentGame = game;
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderLots();
    }

    function renderLots() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const maxP = parseFloat(document.getElementById("maxPrice").value);
      const sort = document.getElementById("sortSelect").value;
      const onlineOnly = document.getElementById("onlineOnly").checked;

      let filtered = allLots.filter(l => {
        if (currentGame !== "all" && l.game !== currentGame) return false;
        if (onlineOnly && !l.online) return false;
        if (!isNaN(maxP) && l.price > maxP) return false;
        if (q && !(l.description.toLowerCase().includes(q) || l.seller.toLowerCase().includes(q) || l.tags.join(" ").toLowerCase().includes(q))) return false;
        return true;
      });

      if (sort === "asc") filtered.sort((a, b) => a.price - b.price);
      if (sort === "desc") filtered.sort((a, b) => b.price - a.price);

      document.getElementById("statsText").textContent = `Найдено: ${filtered.length} / ${allLots.length}`;

      const container = document.getElementById("lotsContainer");
      if (!filtered.length) {
        container.innerHTML = `<div class="loader">По этим фильтрам лотов нет.</div>`;
        return;
      }

      // Рендерим первые 150 для плавности интерфейса
      container.innerHTML = filtered.slice(0, 150).map(l => `
        <div class="card">
          <div>
            <div class="card-top">
              <span class="badge mono">${l.game_name}</span>
              <span class="${l.online ? 'online-tag' : ''}">${l.online ? '● Онлайн' : '○ Офлайн'}</span>
            </div>
            <div class="card-title" style="margin-top:10px;">${escapeHtml(l.title)}</div>
            <div class="tags" style="margin-top:10px;">
              ${l.tags.map(t => `<span class="tag mono">${escapeHtml(t)}</span>`).join("")}
            </div>
          </div>
          <div class="card-foot">
            <div>
              <div class="price mono">${escapeHtml(l.price_str)}</div>
              <div class="seller">${escapeHtml(l.seller)} · ★ ${escapeHtml(l.reviews)}</div>
            </div>
            <div class="card-btns">
              <a href="${l.url}" target="_blank" rel="noopener">FunPay ↗</a>
              <button onclick="openSellerChat(${l.seller_id}, '${escapeJs(l.seller)}')">Написать</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    async function checkAuth() {
      if (!fpKey) return;
      try {
        const res = await fetch("/api/auth", { headers: { "X-FunPay-Key": fpKey } });
        if (!res.ok) throw new Error();
        currentUser = await res.json();
        document.getElementById("authBtn").textContent = `@${currentUser.username}`;
        document.getElementById("logoutBtn").style.display = "inline-block";
      } catch {
        currentUser = null;
        document.getElementById("authBtn").textContent = "Войти в FunPay";
      }
    }

    function openAuthModal() {
      document.getElementById("goldenKeyInput").value = fpKey;
      document.getElementById("authError").textContent = "";
      document.getElementById("overlay").classList.add("open");
      document.getElementById("authModal").classList.add("open");
    }

    async function saveAuth() {
      const key = document.getElementById("goldenKeyInput").value.trim();
      const errEl = document.getElementById("authError");
      errEl.textContent = "Проверка...";
      try {
        const res = await fetch("/api/auth", { headers: { "X-FunPay-Key": key } });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Ошибка входа");
        fpKey = key;
        localStorage.setItem("fp_golden_key", key);
        currentUser = data;
        document.getElementById("authBtn").textContent = `@${currentUser.username}`;
        document.getElementById("logoutBtn").style.display = "inline-block";
        closeAll();
      } catch (e) {
        errEl.textContent = e.message;
      }
    }

    function logout() {
      fpKey = "";
      currentUser = null;
      localStorage.removeItem("fp_golden_key");
      document.getElementById("authBtn").textContent = "Войти в FunPay";
      document.getElementById("logoutBtn").style.display = "none";
      closeAll();
    }

    function openChatsDrawer() {
      if (!currentUser) return openAuthModal();
      document.getElementById("overlay").classList.add("open");
      document.getElementById("chatDrawer").classList.add("open");
      showChatList();
    }

    async function showChatList() {
      stopPolling();
      activeNodeId = null;
      document.getElementById("backToChatsBtn").style.display = "none";
      document.getElementById("drawerFoot").style.display = "none";
      document.getElementById("drawerTitle").textContent = "ЧАТЫ FUNPAY";
      const body = document.getElementById("drawerBody");
      body.innerHTML = `<div class="loader mono">Синхронизация чатов...</div>`;

      const res = await fetch("/api/chats", { headers: { "X-FunPay-Key": fpKey } });
      const data = await res.json();
      if (!data.chats || !data.chats.length) {
        body.innerHTML = `<div class="loader">Диалогов пока нет.</div>`;
        return;
      }
      body.innerHTML = data.chats.map(c => `
        <div class="chat-list-item" onclick="openChat('${c.node_id}', '${escapeJs(c.name)}')">
          <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
            <strong>${escapeHtml(c.name)} ${c.unread ? '●' : ''}</strong>
            <span class="mono" style="font-size:11px; color:var(--muted);">${escapeHtml(c.time)}</span>
          </div>
          <div style="font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            ${escapeHtml(c.last_message)}
          </div>
        </div>
      `).join("");
    }

    function openSellerChat(sellerId, sellerName) {
      if (!currentUser) return openAuthModal();
      if (!sellerId) return alert("Не удалось определить ID продавца. Перейди по ссылке FunPay.");
      const ids = [currentUser.user_id, sellerId].sort((a, b) => a - b);
      const node = `users-${ids[0]}-${ids[1]}`;
      document.getElementById("overlay").classList.add("open");
      document.getElementById("chatDrawer").classList.add("open");
      openChat(node, sellerName);
    }

    async function openChat(nodeId, title) {
      activeNodeId = nodeId;
      document.getElementById("backToChatsBtn").style.display = "inline-block";
      document.getElementById("drawerFoot").style.display = "flex";
      document.getElementById("drawerTitle").textContent = title;
      await fetchMessages();
      stopPolling();
      pollTimer = setInterval(fetchMessages, 4000);
    }

    async function fetchMessages() {
      if (!activeNodeId) return;
      const res = await fetch(`/api/chats/${activeNodeId}`, { headers: { "X-FunPay-Key": fpKey } });
      const data = await res.json();
      if (data.node_id) activeNodeId = data.node_id;

      const body = document.getElementById("drawerBody");
      body.innerHTML = (data.messages || []).map(m => `
        <div class="msg ${m.is_me ? 'me' : ''}">
          <div>${escapeHtml(m.text)}</div>
          <div class="msg-meta mono">${escapeHtml(m.author)} · ${escapeHtml(m.time)}</div>
        </div>
      `).join("") || `<div class="loader">Напиши первое сообщение продавцу.</div>`;
      body.scrollTop = body.scrollHeight;
    }

    async function sendMessage() {
      const inp = document.getElementById("msgInput");
      const text = inp.value.trim();
      if (!text || !activeNodeId) return;
      inp.value = "";
      await fetch("/api/chats/send", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-FunPay-Key": fpKey },
        body: JSON.stringify({ node_id: activeNodeId, text }),
      });
      await fetchMessages();
    }

    function stopPolling() { if (pollTimer) clearInterval(pollTimer); }
    function closeAll() {
      stopPolling();
      document.getElementById("overlay").classList.remove("open");
      document.getElementById("authModal").classList.remove("open");
      document.getElementById("chatDrawer").classList.remove("open");
    }
    function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function escapeJs(s) { return String(s || "").replace(/'/g, "\\'"); }

    checkAuth();
    loadLots();
  </script>
</body>
</html>
