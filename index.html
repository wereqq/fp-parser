<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FP // PARSER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090c;
      --glass: rgba(255, 255, 255, 0.055);
      --glass-strong: rgba(24, 26, 34, 0.58);
      --glass-hover: rgba(255, 255, 255, 0.095);
      --border: rgba(255, 255, 255, 0.14);
      --border-hover: rgba(255, 255, 255, 0.28);
      --rim-top: rgba(255, 255, 255, 0.28);
      --rim-bottom: rgba(255, 255, 255, 0.05);
      --spotlight: rgba(255, 255, 255, 0.12);
      --text: #f5f7fa;
      --text-soft: rgba(245, 247, 250, 0.76);
      --muted: rgba(245, 247, 250, 0.46);
      --accent: #ffffff;
      --accent-inv: #0b0c10;
      --orb-1: rgba(255, 255, 255, 0.11);
      --orb-2: rgba(175, 190, 220, 0.09);
      --orb-3: rgba(130, 145, 175, 0.07);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
      --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.light {
      --bg: #e5e8ee;
      --glass: rgba(255, 255, 255, 0.44);
      --glass-strong: rgba(255, 255, 255, 0.68);
      --glass-hover: rgba(255, 255, 255, 0.66);
      --border: rgba(255, 255, 255, 0.72);
      --border-hover: rgba(255, 255, 255, 0.95);
      --rim-top: rgba(255, 255, 255, 0.95);
      --rim-bottom: rgba(0, 0, 0, 0.04);
      --spotlight: rgba(255, 255, 255, 0.85);
      --text: #12141a;
      --text-soft: rgba(18, 20, 26, 0.72);
      --muted: rgba(18, 20, 26, 0.48);
      --accent: #12141a;
      --accent-inv: #ffffff;
      --orb-1: rgba(255, 255, 255, 0.95);
      --orb-2: rgba(185, 194, 210, 0.65);
      --orb-3: rgba(150, 160, 180, 0.45);
      --shadow: 0 18px 44px rgba(15, 23, 42, 0.11);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.015em;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background 0.45s ease, color 0.3s ease;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .wallpaper {
      position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none;
    }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(85px); will-change: transform;
    }
    .orb-1 {
      width: 58vw; height: 58vw; top: -20vw; left: -10vw;
      background: radial-gradient(circle, var(--orb-1), transparent 68%);
      animation: drift1 20s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 52vw; height: 52vw; bottom: -18vw; right: -8vw;
      background: radial-gradient(circle, var(--orb-2), transparent 68%);
      animation: drift2 25s ease-in-out infinite alternate;
    }
    .orb-3 {
      width: 44vw; height: 44vw; top: 30%; left: 32%;
      background: radial-gradient(circle, var(--orb-3), transparent 68%);
      animation: drift3 17s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(14vw, 12vh) scale(1.18); } }
    @keyframes drift2 { to { transform: translate(-15vw, -10vh) scale(0.9); } }
    @keyframes drift3 { to { transform: translate(10vw, -10vh) scale(1.14); } }

    #bgCanvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.7; }

    .liquid {
      background: var(--glass);
      backdrop-filter: blur(34px) saturate(190%);
      -webkit-backdrop-filter: blur(34px) saturate(190%);
      border: 1px solid var(--border);
      box-shadow:
        var(--shadow),
        inset 0 1px 0 var(--rim-top),
        inset 0 -1px 0 var(--rim-bottom);
    }

    header {
      position: sticky; top: 14px; z-index: 25;
      max-width: 1380px; margin: 14px auto 0;
      width: calc(100% - 32px);
      border-radius: 999px;
      padding: 10px 18px 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      animation: slideDown 0.75s var(--ease-ios) both;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .brand {
      font-size: 14px; letter-spacing: 0.15em; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text); box-shadow: 0 0 12px var(--text);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.35); opacity: 0.45; }
    }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    button, input, select {
      font-family: inherit; font-weight: 400; font-size: 13px;
      background: var(--glass); color: var(--text);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 15px; outline: none;
      box-shadow: inset 0 1px 0 var(--rim-top);
      transition: transform 0.25s var(--ease-ios), border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    button { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    button:hover {
      border-color: var(--border-hover);
      background: var(--glass-hover);
      transform: translateY(-1px);
    }
    button:active { transform: scale(0.95); }
    button.primary {
      background: var(--accent); color: var(--accent-inv);
      border-color: var(--accent); font-weight: 500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }
    button.primary:hover { opacity: 0.9; background: var(--accent); }
    button.icon-btn { padding: 8px 12px; }
    input::placeholder { color: var(--muted); }
    input:focus, select:focus {
      border-color: var(--border-hover);
      background: var(--glass-hover);
    }
    select option { background: var(--bg); color: var(--text); }

    .spin { display: inline-block; animation: spin360 0.8s linear infinite; }
    @keyframes spin360 { to { transform: rotate(360deg); } }

    .toolbar {
      max-width: 1380px; margin: 16px auto 0;
      padding: 0 16px;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      animation: fadeUp 0.75s var(--ease-ios) 0.08s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tabs {
      display: flex; padding: 4px; gap: 3px; border-radius: 999px;
    }
    .tab {
      border: none; background: transparent; box-shadow: none; backdrop-filter: none;
      padding: 6px 14px; font-size: 12px; color: var(--muted); border-radius: 999px;
    }
    .tab:hover { color: var(--text); background: rgba(255,255,255,0.08); transform: none; }
    .tab.active {
      background: var(--accent); color: var(--accent-inv); font-weight: 500;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    }
    .search-input { flex: 1; min-width: 220px; }
    .checkbox-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 14px; border: 1px solid var(--border);
      border-radius: 999px; background: var(--glass);
      backdrop-filter: blur(22px);
      box-shadow: inset 0 1px 0 var(--rim-top);
      font-size: 12px; color: var(--text-soft); cursor: pointer; user-select: none;
    }
    .checkbox-pill input { width: auto; accent-color: var(--accent); cursor: pointer; box-shadow: none; }
    .stats { margin-left: auto; font-size: 12px; color: var(--muted); }

    main { max-width: 1380px; margin: 0 auto; padding: 20px 16px 90px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }
    .card {
      position: relative; overflow: hidden;
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(185%);
      -webkit-backdrop-filter: blur(30px) saturate(185%);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow:
        var(--shadow),
        inset 0 1px 0 var(--rim-top),
        inset 0 -1px 0 var(--rim-bottom);
      padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
      opacity: 0;
      animation: cardIn 0.6s var(--ease-ios) forwards;
      transition: transform 0.35s var(--ease-ios), border-color 0.25s, background 0.25s, box-shadow 0.35s;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(340px circle at var(--mx, -200px) var(--my, -200px), var(--spotlight), transparent 60%);
      opacity: 0; transition: opacity 0.35s ease;
    }
    .card:hover::before { opacity: 1; }
    .card:hover {
      transform: translateY(-5px) scale(1.01);
      border-color: var(--border-hover);
      background: var(--glass-hover);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-top {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--muted); position: relative; z-index: 1;
    }
    .card-top-left { display: flex; align-items: center; gap: 8px; }
    .badge {
      border: 1px solid var(--border); border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 10px; font-size: 10px; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-soft);
    }
    .online-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--text); margin-right: 5px; vertical-align: middle;
      box-shadow: 0 0 8px var(--text);
      animation: pulse 2.2s ease-in-out infinite;
    }
    .fav-btn {
      background: transparent; border: none; box-shadow: none; backdrop-filter: none;
      padding: 3px 7px; font-size: 16px; color: var(--muted);
    }
    .fav-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); transform: scale(1.18); }
    .fav-btn.saved { color: var(--text); }

    .card-title {
      position: relative; z-index: 1;
      font-size: 14px; line-height: 1.5; font-weight: 400; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; cursor: pointer;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; position: relative; z-index: 1; }
    .tag {
      font-size: 11px; color: var(--text-soft);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 9px;
    }
    .card-foot {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border); padding-top: 13px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .price { font-size: 16px; font-weight: 600; color: var(--text); }
    .seller { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .card-btns { display: flex; gap: 6px; }
    .card-btns a, .card-btns button {
      font-size: 12px; padding: 6px 12px; text-decoration: none;
      color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; background: rgba(255, 255, 255, 0.06);
    }
    .card-btns a:hover, .card-btns button:hover {
      border-color: var(--border-hover); background: rgba(255, 255, 255, 0.14);
    }

    .grid.list-view { display: flex; flex-direction: column; gap: 10px; }
    .grid.list-view .card { flex-direction: row; align-items: center; padding: 13px 20px; border-radius: 18px; }
    .grid.list-view .card-main { flex: 1; display: flex; align-items: center; gap: 14px; min-width: 0; }
    .grid.list-view .card-top { min-width: 100px; }
    .grid.list-view .card-title { -webkit-line-clamp: 1; flex: 1; font-size: 13px; margin-top: 0 !important; }
    .grid.list-view .tags { margin-top: 0; max-width: 240px; }
    .grid.list-view .card-foot { border-top: none; padding-top: 0; min-width: 295px; justify-content: flex-end; gap: 16px; }

    .skeleton {
      height: 182px; border-radius: 24px;
      background: linear-gradient(110deg, var(--glass) 25%, var(--glass-hover) 50%, var(--glass) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 40; opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      position: fixed; top: 50%; left: 50%;
      width: 92%; max-width: 480px;
      background: var(--glass-strong);
      backdrop-filter: blur(42px) saturate(200%);
      -webkit-backdrop-filter: blur(42px) saturate(200%);
      border: 1px solid var(--border-hover);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 var(--rim-top);
      border-radius: 28px; padding: 26px; z-index: 50;
      opacity: 0; pointer-events: none;
      transform: translate(-50%, -46%) scale(0.92);
      transition: opacity 0.3s ease, transform 0.45s var(--ease-ios);
    }
    .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .modal h3 { font-weight: 600; font-size: 16px; margin-bottom: 10px; }
    .modal p { font-size: 13px; color: var(--text-soft); line-height: 1.6; margin-bottom: 16px; }
    .modal input { width: 100%; margin-bottom: 14px; }

    .drawer {
      position: fixed; top: 14px; right: 14px; bottom: 14px;
      width: calc(100% - 28px); max-width: 430px;
      background: var(--glass-strong);
      backdrop-filter: blur(42px) saturate(200%);
      -webkit-backdrop-filter: blur(42px) saturate(200%);
      border: 1px solid var(--border-hover);
      border-radius: 28px;
      box-shadow: -20px 0 65px rgba(0, 0, 0, 0.45), inset 0 1px 0 var(--rim-top);
      z-index: 50; display: flex; flex-direction: column; overflow: hidden;
      transform: translateX(calc(100% + 28px));
      transition: transform 0.5s var(--ease-ios);
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .drawer-body {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .chat-list-item {
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 18px; padding: 13px 15px; cursor: pointer;
      transition: transform 0.25s var(--ease-ios), border-color 0.2s, background 0.2s;
      animation: fadeUp 0.35s var(--ease-ios) both;
    }
    .chat-list-item:hover {
      border-color: var(--border-hover); background: var(--glass-hover); transform: translateX(-3px);
    }
    .msg {
      max-width: 85%; padding: 10px 15px;
      background: var(--glass); border: 1px solid var(--border);
      border-radius: 18px; font-size: 13px; line-height: 1.45; white-space: pre-wrap;
      animation: msgIn 0.35s var(--ease-ios) both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg.me {
      align-self: flex-end; background: var(--accent);
      color: var(--accent-inv); border-color: var(--accent);
    }
    .msg-meta { font-size: 10px; opacity: 0.65; margin-top: 5px; }
    .quick-replies { padding: 8px 20px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    .quick-replies button { font-size: 11px; padding: 5px 11px; color: var(--text-soft); }
    .drawer-foot {
      padding: 12px 18px 16px; border-top: 1px solid var(--border);
      display: flex; gap: 8px;
    }
    .drawer-foot input { flex: 1; }
    .empty { text-align: center; padding: 70px 20px; color: var(--muted); font-size: 13px; grid-column: 1 / -1; }

    @media (max-width: 820px) {
      header { border-radius: 22px; flex-wrap: wrap; }
      .grid.list-view .card { flex-direction: column; align-items: stretch; }
      .grid.list-view .card-main { flex-direction: column; align-items: flex-start; }
      .grid.list-view .card-foot { min-width: 0; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div class="wallpaper">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <canvas id="bgCanvas"></canvas>

  <header class="liquid">
    <div class="brand"><span class="dot"></span> FP // PARSER</div>
    <div class="actions">
      <button onclick="loadLots(true)"><span id="refreshIcon">↻</span> Обновить</button>
      <button onclick="openChatsDrawer()">Чаты</button>
      <button id="authBtn" class="primary" onclick="openAuthModal()">Войти в FunPay</button>
      <button class="icon-btn" onclick="toggleTheme()" title="Переключить тему">◐</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs liquid">
      <button class="tab active" data-game="all" onclick="setGame('all', this)">Все</button>
      <button class="tab" data-game="dota2" onclick="setGame('dota2', this)">Dota 2</button>
      <button class="tab" data-game="valorant" onclick="setGame('valorant', this)">Valorant</button>
      <button class="tab" data-game="fav" onclick="setGame('fav', this)">★ Избранное</button>
    </div>

    <input class="search-input" id="searchInput" placeholder="Поиск: MMR, аркана, Vandal, родная почта..." oninput="renderLots()" />
    <input id="maxPrice" type="number" placeholder="До ₽" style="width:105px" oninput="renderLots()" />

    <select id="sortSelect" onchange="renderLots()">
      <option value="default">По умолчанию</option>
      <option value="asc">Сначала дешевле</option>
      <option value="desc">Сначала дороже</option>
    </select>

    <label class="checkbox-pill">
      <input type="checkbox" id="onlineOnly" onchange="renderLots()" /> Онлайн
    </label>

    <div class="tabs liquid">
      <button class="tab active" id="viewGridBtn" onclick="setView('grid')" title="Сетка">⊞</button>
      <button class="tab" id="viewListBtn" onclick="setView('list')" title="Список">☰</button>
    </div>

    <div class="stats mono" id="statsText">—</div>
  </div>

  <main>
    <div id="lotsContainer" class="grid"></div>
  </main>

  <div class="overlay" id="overlay" onclick="closeAll()"></div>

  <div class="modal" id="detailModal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span id="detailBadge" class="badge mono"></span>
      <button onclick="closeAll()" style="padding:4px 10px; border:none; background:transparent; box-shadow:none;">✕</button>
    </div>
    <p id="detailDesc" style="color:var(--text); white-space:pre-wrap; max-height:260px; overflow-y:auto;"></p>
    <div id="detailTags" class="tags" style="margin-bottom:16px;"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:14px;">
      <div>
        <div id="detailPrice" class="price mono"></div>
        <div id="detailSeller" class="seller"></div>
      </div>
      <div style="display:flex; gap:8px;">
        <a id="detailLink" href="#" target="_blank" rel="noopener" style="text-decoration:none;">
          <button>FunPay ↗</button>
        </a>
        <button id="detailChatBtn" class="primary">Написать</button>
      </div>
    </div>
  </div>

  <div class="modal" id="authModal">
    <h3>Авторизация FunPay</h3>
    <p>Вставь свой <span class="mono">golden_key</span> из cookies сайта FunPay. Ключ хранится только в твоем браузере и нужен для синхронизации твоих чатов.</p>
    <input id="goldenKeyInput" type="password" placeholder="Вставь golden_key..." />
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button onclick="logout()" id="logoutBtn" style="display:none;">Выйти</button>
      <button onclick="closeAll()">Отмена</button>
      <button class="primary" onclick="saveAuth()">Подключить</button>
    </div>
    <div id="authError" style="color:#ff6b6b; font-size:12px; margin-top:10px;"></div>
  </div>

  <div class="drawer" id="chatDrawer">
    <div class="drawer-head">
      <div style="display:flex; align-items:center; gap:10px;">
        <button id="backToChatsBtn" style="display:none; padding:4px 10px;" onclick="showChatList()">←</button>
        <span id="drawerTitle" class="mono" style="font-size:13px;">ЧАТЫ FUNPAY</span>
      </div>
      <button onclick="closeAll()" style="padding:4px 10px; border:none; background:transparent; box-shadow:none;">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div id="quickReplies" class="quick-replies" style="display:none;">
      <button onclick="useTemplate('Привет! Аккаунт ещё актуален?')">Актуально?</button>
      <button onclick="useTemplate('Родная почта и чеки есть?')">Родная почта?</button>
      <button onclick="useTemplate('Готов забрать прямо сейчас.')">Готов купить</button>
    </div>
    <div class="drawer-foot" id="drawerFoot" style="display:none;">
      <input id="msgInput" placeholder="Написать продавцу..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button class="primary" onclick="sendMessage()">→</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("bgCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];
    let mouse = { x: -999, y: -999 };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const count = Math.min(50, Math.floor((canvas.width * canvas.height) / 28000));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.24,
        vy: (Math.random() - 0.5) * 0.24,
        r: Math.random() * 1.4 + 0.6,
      }));
    }
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    resizeCanvas();

    function animateBg() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isLight = document.body.classList.contains("light");
      const rgb = isLight ? "30, 36, 48" : "235, 240, 255";

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${rgb}, 0.25)`;
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
          const p2 = particles[j];
          const d = Math.hypot(p.x - p2.x, p.y - p2.y);
          if (d < 130) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(${rgb}, ${(1 - d / 130) * 0.09})`;
            ctx.lineWidth = 0.7;
            ctx.stroke();
          }
        }
        const dm = Math.hypot(p.x - mouse.x, p.y - mouse.y);
        if (dm < 150) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = `rgba(${rgb}, ${(1 - dm / 150) * 0.14})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
      requestAnimationFrame(animateBg);
    }
    animateBg();

    document.addEventListener("mousemove", e => {
      const card = e.target.closest(".card");
      if (!card) return;
      const rect = card.getBoundingClientRect();
      card.style.setProperty("--mx", `${e.clientX - rect.left}px`);
      card.style.setProperty("--my", `${e.clientY - rect.top}px`);
    });

    let allLots = [];
    let currentGame = "all";
    let fpKey = localStorage.getItem("fp_golden_key") || "";
    let favIds = JSON.parse(localStorage.getItem("fp_favs") || "[]");
    let currentUser = null;
    let activeNodeId = null;
    let pollTimer = null;

    if (localStorage.getItem("fp_theme") === "light") document.body.classList.add("light");

    function toggleTheme() {
      document.body.classList.toggle("light");
      localStorage.setItem("fp_theme", document.body.classList.contains("light") ? "light" : "dark");
    }

    function setView(mode) {
      const el = document.getElementById("lotsContainer");
      el.classList.toggle("list-view", mode === "list");
      document.getElementById("viewGridBtn").classList.toggle("active", mode === "grid");
      document.getElementById("viewListBtn").classList.toggle("active", mode === "list");
    }

    async function loadLots(force = false) {
      const container = document.getElementById("lotsContainer");
      const icon = document.getElementById("refreshIcon");
      icon.classList.add("spin");
      container.innerHTML = Array(8).fill('<div class="skeleton"></div>').join("");
      try {
        const res = await fetch(`/api/lots?force=${force}`);
        const data = await res.json();
        allLots = data.lots || [];
        renderLots();
      } catch (e) {
        container.innerHTML = `<div class="empty">Не удалось связаться с сервером.</div>`;
      } finally {
        icon.classList.remove("spin");
      }
    }

    function setGame(game, btn) {
      currentGame = game;
      btn.parentElement.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderLots();
    }

    function toggleFav(id, e) {
      e.stopPropagation();
      if (favIds.includes(id)) favIds = favIds.filter(x => x !== id);
      else favIds.push(id);
      localStorage.setItem("fp_favs", JSON.stringify(favIds));
      renderLots();
    }

    function openDetail(lotId) {
      const l = allLots.find(x => x.id === lotId);
      if (!l) return;
      document.getElementById("detailBadge").textContent = `${l.game_name} · ${l.online ? 'ОНЛАЙН' : 'ОФЛАЙН'}`;
      document.getElementById("detailDesc").textContent = l.description;
      document.getElementById("detailTags").innerHTML = l.tags.map(t => `<span class="tag mono">${escapeHtml(t)}</span>`).join("");
      document.getElementById("detailPrice").textContent = l.price_str;
      document.getElementById("detailSeller").textContent = `${l.seller} · ★ ${l.reviews}`;
      document.getElementById("detailLink").href = l.url;
      document.getElementById("detailChatBtn").onclick = () => {
        closeAll();
        setTimeout(() => openSellerChat(l.seller_id, l.seller), 180);
      };
      document.getElementById("overlay").classList.add("open");
      document.getElementById("detailModal").classList.add("open");
    }

    function renderLots() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const maxP = parseFloat(document.getElementById("maxPrice").value);
      const sort = document.getElementById("sortSelect").value;
      const onlineOnly = document.getElementById("onlineOnly").checked;

      let filtered = allLots.filter(l => {
        if (currentGame === "fav" && !favIds.includes(l.id)) return false;
        if (currentGame !== "all" && currentGame !== "fav" && l.game !== currentGame) return false;
        if (onlineOnly && !l.online) return false;
        if (!isNaN(maxP) && l.price > maxP) return false;
        if (q && !(l.description.toLowerCase().includes(q) || l.seller.toLowerCase().includes(q) || l.tags.join(" ").toLowerCase().includes(q))) return false;
        return true;
      });

      if (sort === "asc") filtered.sort((a, b) => a.price - b.price);
      if (sort === "desc") filtered.sort((a, b) => b.price - a.price);

      document.getElementById("statsText").textContent = `${filtered.length} / ${allLots.length}`;

      const container = document.getElementById("lotsContainer");
      if (!filtered.length) {
        container.innerHTML = `<div class="empty">По выбранным фильтрам лотов нет.</div>`;
        return;
      }

      container.innerHTML = filtered.slice(0, 150).map((l, idx) => {
        const isFav = favIds.includes(l.id);
        const delay = Math.min(idx * 22, 420);
        return `
        <div class="card" style="animation-delay:${delay}ms;">
          <div class="card-main">
            <div class="card-top">
              <div class="card-top-left">
                <span class="badge mono">${l.game_name}</span>
                <span>${l.online ? '<span class="online-dot"></span>Онлайн' : 'Офлайн'}</span>
              </div>
              <button class="fav-btn ${isFav ? 'saved' : ''}" onclick="toggleFav('${l.id}', event)" title="В избранное">
                ${isFav ? '★' : '☆'}
              </button>
            </div>
            <div class="card-title" style="margin-top:8px;" onclick="openDetail('${l.id}')">${escapeHtml(l.description)}</div>
            ${l.tags.length ? `<div class="tags">${l.tags.slice(0, 4).map(t => `<span class="tag mono">${escapeHtml(t)}</span>`).join("")}</div>` : ''}
          </div>
          <div class="card-foot">
            <div>
              <div class="price mono">${escapeHtml(l.price_str)}</div>
              <div class="seller">${escapeHtml(l.seller)} · ★ ${escapeHtml(l.reviews)}</div>
            </div>
            <div class="card-btns">
              <a href="${l.url}" target="_blank" rel="noopener">FunPay ↗</a>
              <button onclick="openSellerChat(${l.seller_id}, '${escapeJs(l.seller)}')">Чат</button>
            </div>
          </div>
        </div>`;
      }).join("");
    }

    async function checkAuth() {
      if (!fpKey) return;
      try {
        const res = await fetch("/api/auth", { headers: { "X-FunPay-Key": fpKey } });
        if (!res.ok) throw new Error();
        currentUser = await res.json();
        document.getElementById("authBtn").textContent = `@${currentUser.username}`;
        document.getElementById("logoutBtn").style.display = "inline-flex";
      } catch {
        currentUser = null;
        document.getElementById("authBtn").textContent = "Войти в FunPay";
      }
    }

    function openAuthModal() {
      document.getElementById("goldenKeyInput").value = fpKey;
      document.getElementById("authError").textContent = "";
      document.getElementById("overlay").classList.add("open");
      document.getElementById("authModal").classList.add("open");
    }

    async function saveAuth() {
      const key = document.getElementById("goldenKeyInput").value.trim();
      const errEl = document.getElementById("authError");
      errEl.textContent = "Проверка ключа...";
      try {
        const res = await fetch("/api/auth", { headers: { "X-FunPay-Key": key } });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Ошибка входа");
        fpKey = key;
        localStorage.setItem("fp_golden_key", key);
        currentUser = data;
        document.getElementById("authBtn").textContent = `@${currentUser.username}`;
        document.getElementById("logoutBtn").style.display = "inline-flex";
        closeAll();
      } catch (e) {
        errEl.textContent = e.message;
      }
    }

    function logout() {
      fpKey = ""; currentUser = null;
      localStorage.removeItem("fp_golden_key");
      document.getElementById("authBtn").textContent = "Войти в FunPay";
      document.getElementById("logoutBtn").style.display = "none";
      closeAll();
    }

    function openChatsDrawer() {
      if (!currentUser) return openAuthModal();
      document.getElementById("overlay").classList.add("open");
      document.getElementById("chatDrawer").classList.add("open");
      showChatList();
    }

    async function showChatList() {
      stopPolling();
      activeNodeId = null;
      document.getElementById("backToChatsBtn").style.display = "none";
      document.getElementById("drawerFoot").style.display = "none";
      document.getElementById("quickReplies").style.display = "none";
      document.getElementById("drawerTitle").textContent = "ЧАТЫ FUNPAY";
      const body = document.getElementById("drawerBody");
      body.innerHTML = `<div class="empty mono">Синхронизация...</div>`;

      const res = await fetch("/api/chats", { headers: { "X-FunPay-Key": fpKey } });
      const data = await res.json();
      if (!data.chats || !data.chats.length) {
        body.innerHTML = `<div class="empty">Диалогов пока нет.</div>`;
        return;
      }
      body.innerHTML = data.chats.map((c, i) => `
        <div class="chat-list-item" style="animation-delay:${Math.min(i * 30, 300)}ms;" onclick="openChat('${c.node_id}', '${escapeJs(c.name)}')">
          <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;">
            <strong style="font-weight:500;">${escapeHtml(c.name)} ${c.unread ? '●' : ''}</strong>
            <span class="mono" style="font-size:11px; color:var(--muted);">${escapeHtml(c.time)}</span>
          </div>
          <div style="font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            ${escapeHtml(c.last_message)}
          </div>
        </div>
      `).join("");
    }

    function openSellerChat(sellerId, sellerName) {
      if (!currentUser) return openAuthModal();
      if (!sellerId) return alert("Не удалось определить ID продавца. Открой лот на FunPay.");
      const ids = [currentUser.user_id, sellerId].sort((a, b) => a - b);
      const node = `users-${ids[0]}-${ids[1]}`;
      document.getElementById("overlay").classList.add("open");
      document.getElementById("chatDrawer").classList.add("open");
      openChat(node, sellerName);
    }

    async function openChat(nodeId, title) {
      activeNodeId = nodeId;
      document.getElementById("backToChatsBtn").style.display = "inline-flex";
      document.getElementById("drawerFoot").style.display = "flex";
      document.getElementById("quickReplies").style.display = "flex";
      document.getElementById("drawerTitle").textContent = title;
      await fetchMessages();
      stopPolling();
      pollTimer = setInterval(fetchMessages, 4000);
    }

    async function fetchMessages() {
      if (!activeNodeId) return;
      const res = await fetch(`/api/chats/${activeNodeId}`, { headers: { "X-FunPay-Key": fpKey } });
      const data = await res.json();
      if (data.node_id) activeNodeId = data.node_id;

      const body = document.getElementById("drawerBody");
      body.innerHTML = (data.messages || []).map(m => `
        <div class="msg ${m.is_me ? 'me' : ''}">
          <div>${escapeHtml(m.text)}</div>
          <div class="msg-meta mono">${escapeHtml(m.author)} · ${escapeHtml(m.time)}</div>
        </div>
      `).join("") || `<div class="empty">Напиши первое сообщение продавцу.</div>`;
      body.scrollTop = body.scrollHeight;
    }

    function useTemplate(text) {
      const inp = document.getElementById("msgInput");
      inp.value = text;
      inp.focus();
    }

    async function sendMessage() {
      const inp = document.getElementById("msgInput");
      const text = inp.value.trim();
      if (!text || !activeNodeId) return;
      inp.value = "";
      await fetch("/api/chats/send", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-FunPay-Key": fpKey },
        body: JSON.stringify({ node_id: activeNodeId, text }),
      });
      await fetchMessages();
    }

    function stopPolling() { if (pollTimer) clearInterval(pollTimer); }
    function closeAll() {
      stopPolling();
      document.getElementById("overlay").classList.remove("open");
      document.getElementById("authModal").classList.remove("open");
      document.getElementById("detailModal").classList.remove("open");
      document.getElementById("chatDrawer").classList.remove("open");
    }
    function escapeHtml(s) { return String(s || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function escapeJs(s) { return String(s || "").replace(/'/g, "\\'"); }

    checkAuth();
    loadLots();
  </script>
</body>
</html>
